name: Central Sync Logic

on:
  workflow_call:
    inputs:
      upstream_url:
        required: true
        type: string
        default: "https://github.com/derlemue/villa-kunterbunt.git"

permissions:
  contents: write

jobs:
  sync-logic:
    runs-on: [self-hosted, vps-debian]
    if: github.repository != 'lemueIO/.github' && github.repository != 'derlemue/villa-kunterbunt'
    
    steps:
      - name: 🧹 Pre-Cleanup
        run: |
          rm -rf ./* || true
          rm -rf ./.git || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync with Upstream
        run: |
          UPSTREAM="${{ inputs.upstream_url }}"
          git remote add upstream "$UPSTREAM" || git remote set-url upstream "$UPSTREAM"
          git fetch upstream main
          
          echo "⚡ Merging Upstream (Safe Mode)..."
          # Merge bewahrt deine lokalen Caller-Dateien im Fork!
          git merge upstream/main --no-edit || echo "Keine Änderungen oder Konflikt"
          
          git push origin main

      - name: ✨ Post-Cleanup
        if: always()
        run: |
          rm -rf "${{ github.workspace }}"/*
          docker system prune -f --volumes || true
