name: Central Stats Logic

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        description: 'Runner label'
        default: 'ubuntu-latest'
    outputs:
      has_changes:
        description: "Whether changes were committed"
        value: ${{ jobs.update-stats.outputs.has_changes }}

permissions:
  contents: write

jobs:
  update-stats:
    name: 📊 Update Stats Script
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: 🧹 Pre-Cleanup
        run: rm -rf "${{ github.workspace }}"/* || true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate Calendar Mapping
        run: python3 scripts/generate_calendar_mapping.py

      - name: Run Update Script
        run: |
          chmod +x scripts/update_stats.sh
          ./scripts/update_stats.sh

      - name: Commit and Push Changes
        id: check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: automated stats update"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: ✨ Post-Cleanup
        if: always()
        run: |
          rm -rf "${{ github.workspace }}"/* || true
